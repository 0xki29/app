name: CI

# Every branch and pull request is checked; main is deployed to GitHub Pages only after every check
# has passed, from the very build that was tested.
on:
  push:
    branches: ['**']
  pull_request:
  # A manual run on main checks and redeploys it.
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes a running check, except on main: a deploy is never cut off halfway.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    # A pull request from a branch of this repository is already checked by its push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # One version, not whatever the runner image has cached (see job node-min for the floor).
          node-version: 24
          cache: npm
      - run: npm ci
      # The dictionary, stroke and license files under public/ (gitignored) are built from inputs
      # pinned in scripts/dict/sources.lock.json; downloads are cached until the lock changes.
      - uses: actions/cache@v6
        with:
          path: .cache/dict-src
          key: dict-src-${{ hashFiles('scripts/dict/sources.lock.json') }}
      - name: Dictionary data (fetch, verify, build, validation gates)
        run: npm run data:build
      - run: npm run lint
      - name: Typecheck
        # `tsc` must be TypeScript 7 (@typescript/native); `typescript` is the 6.x API for linting.
        # The scripts call TS 7 by path; this fails if that path is not TS 7.
        run: |
          node node_modules/@typescript/native/bin/tsc --version | tee /dev/stderr | grep -q '^Version 7\.'
          npm run typecheck
      - run: npm test
      - run: npm run build
      # The site is only useful with its data: fail here rather than deploy an app without a
      # dictionary or stroke files (a build without data only warns). Sizes go to the log.
      - name: dist/ has the data and its notices
        run: |
          for f in dist/dict/v1/manifest.json dist/licenses/THIRD_PARTY_NOTICES.md dist/licenses/ARPHICPL.TXT dist/strokes/v2.0.1/6c38.json; do
            test -s "$f" || { echo "::error::$f is missing from dist/"; exit 1; }
          done
          du -sh --apparent-size dist dist/*
          echo "files: $(find dist -type f | wc -l)"
      - name: E2E (installed Google Chrome, preview of the dist/ just built)
        run: npx playwright test
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      # dist/ holds the app and, copied from public/, the data built above (dict, strokes, licenses).
      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist

  # The oldest Node that engines.node in package.json promises: lint, typecheck, unit tests, build.
  node-min:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22.13'
          cache: npm
      - run: npm ci
      - uses: actions/cache@v6
        with:
          path: .cache/dict-src
          key: dict-src-${{ hashFiles('scripts/dict/sources.lock.json') }}
      - run: npm run data:build
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    needs: [check, node-min]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
